<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jbyrd's Music Collection 🎵</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .music-player {
            background: linear-gradient(to bottom, #0066cc, #003366);
            border: 3px solid #ff6600;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        .track-list {
            background: #fff;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            max-height: 600px;
            overflow-y: auto;
        }
        .track-item {
            padding: 10px;
            margin: 5px 0;
            background: linear-gradient(to right, #e7e7e7, #f5f5f5);
            border-left: 4px solid #0066cc;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }
        .track-item:hover {
            background: linear-gradient(to right, #cce0ff, #e6f2ff);
            border-left-color: #ff6600;
            transform: translateX(5px);
        }
        .track-item.playing {
            background: linear-gradient(to right, #ffcc00, #ffd633);
            border-left-color: #ff6600;
            font-weight: bold;
        }
        /* Hide download button from audio controls */
        audio::-webkit-media-controls-download-button {
            display: none !important;
        }
        audio::-internal-media-controls-download-button {
            display: none !important;
        }
        
        audio {
            width: 100%;
            margin: 15px 0;
        }
        .now-playing {
            color: #ff6600;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .stats {
            color: #fff;
            font-size: 14px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 jbyrd's Music Collection 🎵</h1>
            <p><a href="/">&larr; Back to Profile</a></p>
        </div>

        <div class="music-player">
            <h2 style="color: #ff6600; text-align: center;">MySpace Music Player</h2>
            <div class="stats">
                📀 Total Tracks: <span id="track-count">66</span> | 💾 Total Size: 386 MB
            </div>
            
            <div class="now-playing" id="now-playing">
                ▶️ Click a track to start playing
            </div>
            
            <audio id="audio-player" controls controlsList="nodownload" oncontextmenu="return false">
                <source id="audio-source" src="" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <div class="track-list" id="track-list">
                <!-- Track list will be populated by JavaScript -->
            </div>
        </div>

        <div class="footer">
            <p>© 2025 jbyrd.org | <a href="/" style="color: #fff;">← Back to jbyrd's profile</a></p>
            <p class="disclaimer">Music collection extracted from YouTube Mix playlist.</p>
        </div>
    </div>

        const audioPlayer = document.getElementById('audio-player');
        const audioSource = document.getElementById('audio-source');
        const nowPlaying = document.getElementById('now-playing');
        const trackList = document.getElementById('track-list');
        let currentTrack = null;

        // Populate track list
        tracks.forEach((track, index) => {
            const trackDiv = document.createElement('div');
            trackDiv.className = 'track-item';
            trackDiv.innerHTML = `<strong>${index + 1}.</strong> ${track.replace('.mp3', '').replace(/^\d+ - /, '')}`;
            trackDiv.onclick = () => playTrack(index);
            trackList.appendChild(trackDiv);
        });

        function playTrack(index) {
            // Remove playing class from all tracks
            document.querySelectorAll('.track-item').forEach(item => {
                item.classList.remove('playing');
            });

            // Add playing class to current track
            document.querySelectorAll('.track-item')[index].classList.add('playing');

            // Update audio source
            currentTrack = index;
            audioSource.src = '/music/' + encodeURIComponent(tracks[index]);
            audioPlayer.load();
            audioPlayer.play();

            // Update now playing text
            nowPlaying.textContent = '🎵 Now Playing: ' + tracks[index].replace('.mp3', '').replace(/^\d+ - /, '');
        }

        // Auto-play next track
        audioPlayer.addEventListener('ended', () => {
            if (currentTrack !== null && currentTrack < tracks.length - 1) {
                playTrack(currentTrack + 1);
            }
        });

        // Update track count
        document.getElementById('track-count').textContent = tracks.length;
    </script>
</body>
</html>
