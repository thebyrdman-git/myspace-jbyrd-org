<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spotify Auth - jbyrd's MySpace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #000;
            color: #0f0;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #0f0;
        }
    </style>
</head>
<body>
    <h2>Spotify Authentication</h2>
    <div id="status" class="status">Processing...</div>
    
    <script>
        const statusDiv = document.getElementById('status');
        
        // Handle Spotify OAuth callback (Authorization Code with PKCE)
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        
        if (error) {
            statusDiv.innerHTML = `<strong>Error:</strong> ${error}<br>` +
                                  `Full URL: ${window.location.href}<br><br>` +
                                  `Redirecting back in 3 seconds...`;
            setTimeout(() => {
                if (window.opener) {
                    window.close();
                } else {
                    window.location.href = '/';
                }
            }, 3000);
        } else if (code) {
            statusDiv.innerHTML = '✓ Authorization successful!<br>Exchanging code for token...';
            
            // Exchange authorization code for access token
            exchangeCodeForToken(code);
        } else {
            statusDiv.innerHTML = '<strong>No code or error received</strong><br>' +
                                  `Full URL: ${window.location.href}<br><br>` +
                                  'This usually means:<br>' +
                                  '1. The Redirect URI in Spotify Dashboard doesn\'t match exactly<br>' +
                                  '2. The app isn\'t properly configured<br><br>' +
                                  'Redirecting back in 5 seconds...';
            setTimeout(() => {
                if (window.opener) {
                    window.close();
                } else {
                    window.location.href = '/';
                }
            }, 5000);
        }

        async function exchangeCodeForToken(code) {
            const codeVerifier = localStorage.getItem('pkce_code_verifier');
            
            if (!codeVerifier) {
                statusDiv.innerHTML = '<strong>Error:</strong> PKCE code verifier not found<br>Redirecting back...';
                setTimeout(() => window.close(), 2000);
                return;
            }

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        client_id: '0d3668e069af4fe8a1d17b8d77785a5c',
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: 'https://jbyrd.org/spotify-callback.html',
                        code_verifier: codeVerifier,
                    })
                });

                const data = await response.json();
                
                if (data.access_token) {
                    statusDiv.innerHTML = '✓ Token received!<br>Setting up player...';
                    
                    // Store token in localStorage
                    localStorage.setItem('spotify_access_token', data.access_token);
                    localStorage.removeItem('pkce_code_verifier'); // Clean up
                    
                    // Close popup and reload parent
                    if (window.opener) {
                        window.opener.postMessage({ type: 'spotify_auth_success', token: data.access_token }, '*');
                        setTimeout(() => window.close(), 500);
                    } else {
                        setTimeout(() => window.location.href = '/', 1000);
                    }
                } else {
                    statusDiv.innerHTML = `<strong>Token exchange failed</strong><br>${JSON.stringify(data)}<br>Redirecting back...`;
                    setTimeout(() => window.close(), 3000);
                }
            } catch (err) {
                statusDiv.innerHTML = `<strong>Error:</strong> ${err.message}<br>Redirecting back...`;
                setTimeout(() => window.close(), 3000);
            }
        }
    </script>
</body>
</html>
